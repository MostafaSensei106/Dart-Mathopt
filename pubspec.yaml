name: dart_mathopt
description: "Mathematical optimization for Dart & Flutter (LP/MILP/QP) powered by HiGHS and Clarabel via Rust FFI."
version: 0.0.1-dev.1

repository: https://github.com/MostafaSensei106/Dart-Mathopt
issue_tracker: https://github.com/MostafaSensei106/Dart-Mathopt/issues

license: GPL-version 3.0

funding:
- https://github.com/sponsors/MostafaSensei106
- https://buymeacoffee.com/7yz1lqkegy
- https://ipn.eg/S/mostafasensei106/instapay/0dlUfz

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.13.0
  collection: ^1.19.1
  equatable: ^3.0.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logging: ^1.3.0
  meta: ^1.19.0

dev_dependencies:
  ffi: ^2.1.3
  ffigen: ^23.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:

  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
