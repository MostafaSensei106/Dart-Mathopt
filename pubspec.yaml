name: dart_mathopt
description: "Mathematical optimization for Dart & Flutter (LP/MILP/QP) powered by HiGHS and Clarabel via Rust FFI."
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: ^2.13.0
  collection: ^1.19.1
  equatable: ^3.0.0
  freezed_annotation: ^3.1.0
  logging: ^1.3.0
  meta: ^1.19.0

dev_dependencies:
  ffi: ^2.1.3
  ffigen: ^23.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  freezed: ^4.0.2
  build_runner: ^2.16.1

flutter:

  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
  # NOTE: no `web:` plugin entry on purpose. Web works without a
  # federated web plugin: build the WASM package and serve it from the
  # *app's* `web/pkg/` directory (see README "Web builds"), because the
  # FRB web loader fetches it from the `pkg/` server root. Flutter
  # assets (`assets/packages/...`) would be served from the wrong path.
