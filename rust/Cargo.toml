[package]
name = "dart_mathopt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
clarabel = "0.11.1"
flutter_rust_bridge = "=2.13.0"
good_lp = "1.15.3"
highs = "2.4.0"
log = "0.4.34"
microlp = "0.6.0"
once_cell = "1.21.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
