[package]
name = "dart_mathopt"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
clarabel = "0.11.1"
flutter_rust_bridge = "=2.13.0"
good_lp = { version = "1.15.3", default-features = false, features = ["microlp"] }
highs = "2.4.0"
thiserror = "2.0.21"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
